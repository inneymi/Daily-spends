        .footer { margin-top: 16px; padding: 12px 0; border-top: 1px solid #374151; text-align: center; }
        .footer-link { background: transparent; border: none; color: #9ca3af; font-size: 12px; cursor: pointer; padding: 8px 12px; border-radius: 6px; }
        .footer-link:hover { color: #d1d5db; background: rgba(55, 65, 81, 0.5); }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { background: #1f2937; border-radius: 16px; padding: 20px; width: 100%; max-width: 280px; }
        .modal-header { text-align: center; margin-bottom: 12px; }
        .modal-date { font-size: 16px; color: #f9fafb; margin-bottom: 6px; }
        .modal-total { background: #059669; color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; }
        .amount-input { width: 100%; padding: 12px; background: #374151; border: 2px solid #4b5563; border-radius: 8px; color: #f9fafb; font-size: 14px; text-align: center; outline: none; margin-bottom: 8px; }
        .amount-input:focus { border-color: #3b82f6; }

        .notes-input:focus { border-color: #3b82f6; }
        .transaction-summary { background: #374151; border-radius: 8px; padding: 8px 12px; margin: 12px 0; font-size: 11px; color: #d1d5db; border: 1px solid #4b5563; text-align: center; cursor: pointer; }

 <button type="button" class="pill-btn active" data-category="General"><i data-lucide="tag"></i> General</button>

<script>
    document.addEventListener('click', function(e) {
  if (e.target && e.target.classList.contains('pill-btn')) {
    document.querySelectorAll('.pill-btn').forEach(btn => btn.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('categoryInput').value = e.target.getAttribute('data-category');

});
    // Spending Categories Setup
const spendingCategories = {
  General: { name: 'General', color: 'bg-slate-600', icon: 'tag' },
  Food: { name: 'Food', color: 'bg-emerald-600', icon: 'utensils' },
  Transport: { name: 'Transport', color: 'bg-blue-600', icon: 'car' },
  Bills: { name: 'Bills', color: 'bg-amber-600', icon: 'receipt' },
  Shopping: { name: 'Shopping', color: 'bg-purple-600', icon: 'shopping-bag' },
  Fun: { name: 'Fun', color: 'bg-rose-600', icon: 'smile' }
};

function getCategory(categoryName) {
  return spendingCategories[categoryName] || spendingCategories.General;
}
let spendingData = {};
let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let selectedDay = null;
const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function loadData() {
    try {
        const saved = localStorage.getItem('spendingData');
        spendingData = saved ? JSON.parse(saved) : {};
    } catch (e) {
        spendingData = {};
    }
}

function saveData() {
    try {
        localStorage.setItem('spendingData', JSON.stringify(spendingData));
    } catch (e) {
        console.error('Save failed:', e);
    }
}

function closeTransactionDetails() {
    const modal = document.getElementById('transactionDetailsModal');
    if (modal) modal.remove();
    selectedDay = null;
    buildCalendar();
}

function deleteTransaction(transactionId) {
    const dayToDelete = selectedDay;
    const dateKey = currentYear + '-' + currentMonth + '-' + dayToDelete;
    const data = spendingData[dateKey];
    
    if (!data || !data.transactions) return;
    
    const filtered = data.transactions.filter(t => t.id !== transactionId);
    
    if (filtered.length === 0) {
        delete spendingData[dateKey];
    } else {
        spendingData[dateKey].transactions = filtered;
    }
    
    saveData();
    updateDisplay();
    buildCalendar();
    
    const modal = document.getElementById('transactionDetailsModal');
    if (modal) modal.remove();
    
    const remaining = spendingData[dateKey];
    if (!remaining || !remaining.transactions || remaining.transactions.length === 0) {
        selectedDay = null;
    } else if (selectedDay) {
        openTransactionDetails();
    }
}

function editTransaction(transactionId) {
    const dateKey = currentYear + '-' + currentMonth + '-' + selectedDay;
    const data = spendingData[dateKey];
    if (data && data.transactions) {
        const transaction = data.transactions.find(t => t.id === transactionId);
        if (transaction) {
            closeTransactionDetails();
            openModal(selectedDay);
            document.getElementById('amountInput').value = transaction.amount.toFixed(2);
            document.getElementById('notesInput').value = transaction.notes || '';
            const addBtn = document.getElementById('addBtn');
            addBtn.textContent = 'Update';
            const originalAddSpending = addBtn.onclick;
            addBtn.onclick = function() {
                const amount = parseFloat(document.getElementById('amountInput').value);
                const notes = document.getElementById('notesInput').value.trim();
                if (isNaN(amount) || amount <= 0) {
                    showError('Please enter a valid amount');
                    return;
                }
                data.transactions = data.transactions.filter(t => t.id !== transactionId);
                data.transactions.push({
                    id: 'tx-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9),
                    amount: amount,
                    notes: notes.substring(0, 100) || '',
                    time: transaction.time
                });
                saveData();
                updateDisplay();
                buildCalendar();
                document.getElementById('amountInput').value = '';
                document.getElementById('notesInput').value = '';
                addBtn.textContent = 'Add';
                addBtn.onclick = originalAddSpending;
                closeModal();
            };
        }
    }
}

function getDateKey(day) { return currentYear + '-' + currentMonth + '-' + day; }
function getDayTotal(day) {
    const data = spendingData[getDateKey(day)];
    return (data && data.transactions) ? data.transactions.reduce((sum, t) => sum + (t.amount || 0), 0) : 0;
}
function getDayTransactions(day) {
    const data = spendingData[getDateKey(day)];
    return (data && data.transactions) ? data.transactions : [];
}
function getMonthTotal() {
    let total = 0;
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    for (let day = 1; day <= daysInMonth; day++) total += getDayTotal(day);
    return total;
}

function buildCalendar() {
    const grid = document.getElementById('daysGrid');
    if (!grid) return;
    grid.innerHTML = '';
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const today = new Date();
    for (let i = 0; i < firstDay; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.className = 'day empty-day';
        grid.appendChild(emptyDay);
    }
    for (let day = 1; day <= daysInMonth; day++) {
        const dayEl = document.createElement('button');
   const isToday = day === today.getDate() && 
                currentMonth === today.getMonth() && 
                currentYear === today.getFullYear();

dayEl.className = isToday ? 'day today' : 'day';
        
        const amount = getDayTotal(day);
        if (amount > 0) dayEl.className += ' has-spending';
        dayEl.innerHTML = `<div class="day-number">${day}</div>` + (amount > 0 ? `<div class="day-amount">£${amount.toFixed(2)}</div>` : '<div class="plus-icon">+</div>');
        dayEl.onclick = () => openModal(day);
        grid.appendChild(dayEl);
    }
}

function updateDisplay() {
    document.getElementById('monthTitle').textContent = months[currentMonth] + ' ' + currentYear;
    document.getElementById('monthTotal').textContent = 'Total: £' + getMonthTotal().toFixed(2);
}

function updateTransactionSummary() {
    const transactions = getDayTransactions(selectedDay);
    const summaryText = document.getElementById('summaryText');
    const summaryHint = document.getElementById('summaryHint');
    const summary = document.getElementById('transactionSummary');
    if (transactions.length === 0) {
        summaryText.textContent = 'No transactions yet';
        summaryHint.style.display = 'none';
        summary.onclick = null;
    } else {
        const withNotes = transactions.filter(t => t.notes && t.notes.trim()).length;
        summaryText.innerHTML = transactions.length === 1 ? '<span style="color: #34d399; font-weight: 600;">1 transaction</span>' + (withNotes > 0 ? ' with notes' : '') : '<span style="color: #34d399; font-weight: 600;">' + transactions.length + ' transactions</span>' + (withNotes > 0 ? ' (' + withNotes + ' with notes)' : '');
        summaryHint.style.display = 'block';
        summary.onclick = () => openTransactionDetails();
    }
}

function openTransactionDetails() {
    if (!selectedDay || getDayTransactions(selectedDay).length === 0) return;
    document.getElementById('modal').classList.remove('show');
    const transactions = getDayTransactions(selectedDay);
    const modal = document.createElement('div');
    modal.id = 'transactionDetailsModal';
    modal.style.cssText = 'position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 1001;';
    const content = document.createElement('div');
    content.style.cssText = 'background: #1f2937; border-radius: 16px; padding: 20px; width: 100%; max-width: 300px;';
    const header = document.createElement('div');
    header.style.cssText = 'text-align: center; margin-bottom: 16px;';
    header.innerHTML = `<div style="font-size: 14px; font-weight: bold; color: #f9fafb; margin-bottom: 4px;">${months[currentMonth]} ${selectedDay}</div><div style="background: #059669; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block;">Total: £${getDayTotal(selectedDay).toFixed(2)}</div>`;
    content.appendChild(header);
    const title = document.createElement('div');
    title.style.cssText = 'font-size: 14px; font-weight: bold; color: #f9fafb; margin-bottom: 12px;';
    title.textContent = 'Transactions';
    content.appendChild(title);
    const list = document.createElement('div');
    list.style.cssText = 'max-height: 300px; overflow-y: auto; margin-bottom: 16px;';
    transactions.forEach(t => {
        const item = document.createElement('div');
        item.style.cssText = 'background: #374151; border-radius: 8px; padding: 12px; margin-bottom: 6px;';
        const itemHeader = document.createElement('div');
        itemHeader.style.cssText = 'display: flex; justify-content: space-between; margin-bottom: 4px;';
        itemHeader.innerHTML = `<div style="color: #34d399; font-weight: bold; font-size: 10px;">£${t.amount.toFixed(2)}</div><div style="font-size: 11px; color: #9ca3af;">${t.time || '--:--'}</div>`;
        item.appendChild(itemHeader);
        const catKey = t.category || 'General';
const cat = spendingCategories[catKey] || spendingCategories['General'];

const badge = document.createElement('div');
badge.innerHTML = `<span class="category-badge"><i data-lucide="${cat.icon}"></i> ${cat.name}</span>`;
item.appendChild(badge);
        if (t.notes) {
            const notes = document.createElement('div');
            notes.style.cssText = 'font-size: 10px; color: #d1d5db; margin-bottom: 6px; font-style: italic;';
            notes.textContent = t.notes;
            item.appendChild(notes);
        }
        const buttons = document.createElement('div');
        buttons.style.cssText = 'display: flex; gap: 6px;';
        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.style.cssText = 'background: #3b82f6; color: white; border: none; border-radius: 4px; padding: 6px 12px; font-size: 11px; cursor: pointer;';
        editBtn.onclick = () => editTransaction(t.id);
        buttons.appendChild(editBtn);
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.style.cssText = 'background: #6b7280; color: white; border: none; border-radius: 4px; padding: 6px 12px; font-size: 11px; cursor: pointer;';
        deleteBtn.onclick = () => deleteTransaction(t.id);
        buttons.appendChild(deleteBtn);
        item.appendChild(buttons);
        list.appendChild(item);
    });
    content.appendChild(list);
    const closeBtn = document.createElement('button');
    closeBtn.textContent = 'Close';
    closeBtn.style.cssText = 'width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; background: #6b7280; color: white;';
    closeBtn.onclick = closeTransactionDetails;
    content.appendChild(closeBtn);
    modal.appendChild(content);
    modal.onclick = (e) => { if (e.target === modal) closeTransactionDetails(); };
    document.body.appendChild(modal);
    if (window.lucide) {
        lucide.createIcons();
}

function showError(msg) {
    const errorEl = document.getElementById('amountError');
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
    setTimeout(() => errorEl.style.display = 'none', 3000);
}

function showHelp() {
    const modal = document.createElement('div');
    modal.id = 'helpModalDynamic';
    modal.className = 'modal show';
    modal.innerHTML = '<div class="modal-content"><div class="modal-header"><div class="modal-date" style="font-size: 16px; font-weight: bold;">Daily Spends Help</div></div><div style="text-align: left; margin-bottom: 16px; line-height: 1.4; font-size: 12px; color: #d1d5db;"><div style="margin-bottom: 16px;"><div style="color: #34d399; font-weight: bold; margin-bottom: 6px;">Data Storage</div><div>Your data is saved in your browser.</div></div><div style="margin-bottom: 16px;"><div style="color: #34d399; font-weight: bold; margin-bottom: 6px;">Managing</div><div>• Select a day<br>• Enter amount<br>• Add notes<br>• Edit or delete</div></div></div><div class="modal-buttons"><button onclick="closeHelp()" class="modal-btn btn-close">Got it!</button></div></div>';
    document.body.appendChild(modal);
    modal.onclick = (e) => { if (e.target === modal) closeHelp(); };
}

function closeHelp() {
    const modal = document.getElementById('helpModalDynamic');
    if (modal) modal.remove();
}

function navigateMonth(dir) {
    currentMonth += dir;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    updateDisplay();
    buildCalendar();
}

function openModal(day) {
    selectedDay = day;
    document.getElementById('modalDate').textContent = months[currentMonth] + ' ' + day;
    document.getElementById('modalTotal').textContent = 'Total: £' + getDayTotal(day).toFixed(2);
    document.getElementById('amountInput').value = '';
    document.getElementById('notesInput').value = '';
    document.getElementById('amountError').style.display = 'none';
    const addBtn = document.getElementById('addBtn');
    addBtn.textContent = 'Add';
    addBtn.onclick = addSpending;
    updateTransactionSummary();
    document.getElementById('modal').classList.add('show');
    buildCalendar();
    setTimeout(() => document.getElementById('amountInput').focus(), 100);
}

function closeModal() {
    document.getElementById('modal').classList.remove('show');
    selectedDay = null;
    buildCalendar();
}

function addSpending() {
    const amountInput = document.getElementById('amountInput');
    const amount = parseFloat(amountInput.value);
    const notes = document.getElementById('notesInput').value.trim();
    const category = document.getElementById('categoryInput') ? document.getElementById('categoryInput').value : 'General';
    if (isNaN(amount) || amount <= 0) {
        showError('Please enter a valid amount');
        return;
    }
    const dateKey = getDateKey(selectedDay);
    const existingData = spendingData[dateKey];
    const transactions = (existingData && existingData.transactions) ? existingData.transactions.slice() : [];
    transactions.push({
        id: 'tx-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9),
        amount: amount,
        notes: notes.substring(0, 100) || '',
        category: category,
        time: new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
    });
    spendingData[dateKey] = { transactions: transactions };
    document.getElementById('amountInput').value = '';
    document.getElementById('notesInput').value = '';
    document.getElementById('modalTotal').textContent = 'Total: £' + getDayTotal(selectedDay).toFixed(2);
    saveData();
    updateDisplay();
    buildCalendar();
    updateTransactionSummary();
    setTimeout(() => document.getElementById('amountInput').focus(), 100);
}

function openMonthlyOverview() {
    const total = getMonthTotal();
    let html = `<div onclick="if(event.target === this) closeMonthlyOverview()" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 1001;"><div style="background: #1f2937; border-radius: 16px; padding: 20px; width: 100%; max-width: 300px;"><div style="text-align: center; margin-bottom: 16px;"><div style="font-size: 14px; font-weight: bold; color: #f9fafb;">${months[currentMonth]} ${currentYear}</div><div style="background: #059669; color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; margin-top: 8px;">Total: £${total.toFixed(2)}</div></div><div style="max-height: 400px; overflow-y: auto; margin-bottom: 16px;">`;
    const allTransactions = [];
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    for (let day = 1; day <= daysInMonth; day++) {
        getDayTransactions(day).forEach(t => allTransactions.push({ day, transaction: t }));
    }
    if (allTransactions.length === 0) {
        html += '<div style="text-align: center; color: #9ca3af; padding: 40px 20px; font-size: 12px;">No transactions</div>';
    } else {
        allTransactions.sort((a, b) => a.day - b.day);
        let currentDay = null;
        allTransactions.forEach(item => {
            if (currentDay !== item.day) {
                currentDay = item.day;
                const date = new Date(currentYear, currentMonth, item.day);
                const dayName = date.toLocaleDateString('en-GB', { weekday: 'short' });
                html += `<div style="color: #d1d5db; font-size: 12px; font-weight: bold; margin: 12px 0 8px 0;">${dayName} ${item.day}</div>`;
            }
            html += `<div style="background: #374151; border-radius: 8px; padding: 12px; margin-bottom: 6px;"><div style="display: flex; justify-content: space-between; margin-bottom: 4px;"><div style="color: #34d399; font-weight: bold; font-size: 10px;">£${item.transaction.amount.toFixed(2)}</div><div style="font-size: 11px; color: #9ca3af;">${item.transaction.time || '--:--'}</div></div>${item.transaction.notes ? `<div style="font-size: 10px; color: #d1d5db; font-style: italic;">${item.transaction.notes}</div>` : ''}</div>`;
        });
    }
    html += '</div><button onclick="closeMonthlyOverview()" style="width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; background: #6b7280; color: white;">Close</button></div></div>';
    const modal = document.createElement('div');
    modal.id = 'monthlyOverviewModal';
    modal.innerHTML = html;
    document.body.appendChild(modal);
}

function closeMonthlyOverview() {
    const modal = document.getElementById('monthlyOverviewModal');
    if (modal) modal.remove();
}

document.getElementById('prevBtn').onclick = () => navigateMonth(-1);
document.getElementById('nextBtn').onclick = () => navigateMonth(1);
document.getElementById('addBtn').onclick = addSpending;
document.getElementById('closeBtn').onclick = closeModal;
document.getElementById('helpBtn').onclick = showHelp;
document.getElementById('monthTotal').onclick = () => openMonthlyOverview();
document.getElementById('modal').onclick = function(e) { if (e.target === this) closeModal(); };
document.getElementById('amountInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); addSpending(); } });
document.getElementById('notesInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') { e.preventDefault(); addSpending(); } });

loadData();
updateDisplay();
buildCalendar();
    lucide.createIcons();
</script>
</body>
