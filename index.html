<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Spends</title>
    <style>
        .category-badge svg,
.category-badge i {
  width: 14px;
  height: 14px;
  display: inline-block;
  vertical-align: middle;
}
        .category-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  margin-top: 4px;
  margin-bottom: 6px;
  background-color: rgba(255, 255, 255, 0.12);
  color: #e5e7eb;
}
}

.category-badge svg {
  width: 12px;
  height: 12px;
}
        /* Glowing outline and shadow for today's calendar cell */
.day.today {
  position: relative;
  border: 1px solid #3b82f6 !important;
  box-shadow: 0 0 10px rgba(59, 130, 246, 0.4), inset 0 0 6px rgba(59, 130, 246, 0.2);
}

/* Glowing dot in the top corner of today's cell */
.day.today::after {
  content: '';
  position: absolute;
  top: 6px;
  right: 6px;
  width: 5px;
  height: 5px;
  background-color: #60a5fa;
  border-radius: 50%;
  box-shadow: 0 0 6px #60a5fa;
}
        /* Remove up/down spinners from number inputs */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

input[type="number"] {
  -moz-appearance: textfield;
}
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111827; color: #f9fafb; min-height: 100vh; padding: 16px; }
        .container { max-width: 360px; margin: 0 auto; background: #1f2937; border-radius: 16px; padding: 12px; }
        @media (min-width: 768px) { .container { max-width: 420px; } }
        .header { display: flex; justify-content: space-between; align-items: center; }
        .title { font-size: 14px; font-weight: bold; }
        .subtitle { color: #9ca3af; font-size: 9px; margin-bottom: 10px; }
        .total { background: #059669; color: white; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; border: none; }
        .total:hover { background: #047857; }
        .nav { display: flex; justify-content: center; align-items: center; margin-bottom: 12px; gap: 2px; }
        .nav-btn { background: #374151; border: none; color: #d1d5db; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
        .nav-btn:hover { background: #4b5563; }
        .month-title { font-size: 14px; font-weight: bold; flex: 1; text-align: center; }
        .calendar { background: #374151; border-radius: 12px; padding: 8px; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 6px; }
        .weekday { text-align: center; font-size: 8px; color: #9ca3af; padding: 4px 0; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; min-height: 180px; }
        .day { aspect-ratio: 1; border: 1px solid #6b7280; background: #4b5563; border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; cursor: pointer; padding: 3px 2px; font-size: 10px; }
        .day:hover { background: #6b7280; transform: scale(1.05); }
        .day.today { border-color: #3b82f6; background: rgba(59, 130, 246, 0.3); box-shadow: 0 0 8px rgba(59, 130, 246, 0.4); }
        .day.has-spending { border-color: #10b981; background: rgba(16, 185, 129, 0.2); }
        .day-number { font-weight: 600; font-size: 8px; color: #f9fafb; }
        .day-amount { font-size: 10px; color: #34d399; }
        .plus-icon { font-size: 8px; color: #6b7280; }
        .empty-day { border: none; background: none; cursor: default; }
        .empty-day:hover { transform: none; }
        .footer { margin-top: 16px; padding: 12px 0; border-top: 1px solid #374151; text-align: center; }
        .footer-link { background: transparent; border: none; color: #9ca3af; font-size: 12px; cursor: pointer; padding: 8px 12px; border-radius: 6px; }
        .footer-link:hover { color: #d1d5db; background: rgba(55, 65, 81, 0.5); }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
        .modal.show { display: flex; }
        .modal-content { background: #1f2937; border-radius: 16px; padding: 20px; width: 100%; max-width: 280px; }
        .modal-header { text-align: center; margin-bottom: 12px; }
        .modal-date { font-size: 16px; color: #f9fafb; margin-bottom: 6px; }
        .modal-total { background: #059669; color: white; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; }
        .amount-input { width: 100%; padding: 12px; background: #374151; border: 2px solid #4b5563; border-radius: 8px; color: #f9fafb; font-size: 14px; text-align: center; outline: none; margin-bottom: 8px; }
        .amount-input:focus { border-color: #3b82f6; }
        .notes-input { width: 100%; padding: 10px; background: #374151; border: 2px solid #4b5563; border-radius: 8px; color: #f9fafb; font-size: 13px; outline: none; margin-bottom: 12px; }
        .notes-input:focus { border-color: #3b82f6; }
        .transaction-summary { background: #374151; border-radius: 8px; padding: 8px 12px; margin: 12px 0; font-size: 11px; color: #d1d5db; border: 1px solid #4b5563; text-align: center; cursor: pointer; }
        .transaction-summary:hover { background: #4b5563; }
        .modal-buttons { display: flex; gap: 6px; margin-top: 16px; }
        .modal-btn { flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .btn-add { background: #3b82f6; color: white; }
        .btn-add:hover { background: #2563eb; }
        .btn-close { background: #6b7280; color: #d1d5db; }
        .btn-close:hover { background: #4b5563; }
        .error-message { color: #f87171; font-size: 12px; margin-top: 4px; text-align: center; display: none; }
        .category-pills-container {
  margin-bottom: 12px;
  text-align: left;
}
.category-label {
  display: block;
  font-size: 11px;
  color: #94a3b8;
  margin-bottom: 6px;
}
.category-pills {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.pill-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #94a3b8;
  padding: 6px 4px;
  border-radius: 6px;
  font-size: 11px;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.2s ease;
}

.pill-btn svg,
.pill-btn [data-lucide] {
  width: 12px !important;
  height: 12px !important;
  min-width: 12px;
  stroke-width: 2;
}
.pill-btn.active {
  background: #2563eb;
  color: #ffffff;
  border-color: #3b82f6;
}
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">Daily Spends</div>
            <button class="total" id="monthTotal">Total: £0.00</button>
        </div>
        <div class="subtitle">Click any day to track spending</div>
        <div class="nav">
            <button class="nav-btn" id="prevBtn">‹ Prev</button>
            <div class="month-title" id="monthTitle">November 2025</div>
            <button class="nav-btn" id="nextBtn">Next ›</button>
        </div>
        <div class="calendar">
            <div class="weekdays">
                <div class="weekday">Sun</div><div class="weekday">Mon</div><div class="weekday">Tue</div><div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div>
            </div>
            <div class="days" id="daysGrid"></div>
        </div>
        <div class="footer">
            <button class="footer-link" id="helpBtn">Help</button>
        </div>
    </div>
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-date" id="modalDate" style="font-size: 14px; font-weight: bold;">November 15</div>
                <div class="modal-total" id="modalTotal">Total: £0.00</div>
            </div>
          <input type="number" step="0.01" class="amount-input" id="amountInput" placeholder="Amount to add (£)" style="font-size: 16px;">
<div id="amountError" class="error-message"></div>
         <div class="category-pills-container">
  <div class="category-pills-container">
  <div class="category-pills" id="categoryPills">
 <button type="button" class="pill-btn active" data-category="General"><i data-lucide="tag"></i> General</button>
<button type="button" class="pill-btn" data-category="Food"><i data-lucide="utensils"></i> Food</button>
<button type="button" class="pill-btn" data-category="Transport"><i data-lucide="car"></i> Transport</button>
<button type="button" class="pill-btn" data-category="Bills"><i data-lucide="receipt"></i> Bills</button>
<button type="button" class="pill-btn" data-category="Shopping"><i data-lucide="shopping-bag"></i> Shopping</button>
<button type="button" class="pill-btn" data-category="Fun"><i data-lucide="smile"></i> Fun</button>
  </div>
  <input type="hidden" id="categoryInput" value="General">
</div>
<input type="text" class="notes-input" id="notesInput" placeholder="Notes (optional)" maxlength="100" style="font-size: 16px;">
<div id="transactionSummary" class="transaction-summary">
                <div id="summaryText">No transactions yet</div>
                <div id="summaryHint" style="display: none; color: #9ca3af; font-size: 10px; margin-top: 2px;">Tap to view details</div>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-add" id="addBtn">Add</button>
                <button class="modal-btn btn-close" id="closeBtn">Close</button>
            </div>
        </div>
    </div>

<script>
    let currentYear = new Date().getFullYear();
    let currentMonth = new Date().getMonth();
    let selectedDate = null;
    let transactions = {};

    const spendingCategories = {
        'Food': { name: 'Food', color: 'bg-emerald-600', icon: 'utensils' },
        'General': { name: 'General', color: 'bg-slate-600', icon: 'wallet' },
        'Transport': { name: 'Transport', color: 'bg-amber-600', icon: 'bus' },
        'Bills': { name: 'Bills', color: 'bg-rose-600', icon: 'file-text' }
    };

    function loadData() {
        const saved = localStorage.getItem('daily_spends_data');
        if (saved) {
            try { transactions = JSON.parse(saved); } catch(e) { transactions = {}; }
        }
    }

    function saveData() {
        localStorage.setItem('daily_spends_data', JSON.stringify(transactions));
    }

    function updateDisplay() {
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        document.getElementById('yourActualHtmlElementId').textContent = `${monthNames[currentMonth]} ${currentYear}`;
        
        const monthKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;
        const monthTransactions = transactions[monthKey] || [];
        const total = monthTransactions.reduce((sum, t) => sum + parseFloat(t.amount || 0), 0);
        document.getElementById('monthTotal').textContent = `Total: £${total.toFixed(2)}`;
    }

    function navigateMonth(direction) {
        currentMonth += direction;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        } else if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        updateDisplay();
        buildCalendar();
    }

    function buildCalendar() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = '';

        const firstDay = new Date(currentYear, currentMonth, 1).getDay();
        const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
        const monthKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`;

        for (let i = 0; i < firstDay; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'calendar-day empty';
            grid.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const cell = document.createElement('div');
            cell.className = 'calendar-day';
            const dateStr = `${monthKey}-${String(day).padStart(2, '0')}`;
            
            const dayTransactions = (transactions[monthKey] || []).filter(t => t.date === dateStr);
            const dayTotal = dayTransactions.reduce((sum, t) => sum + parseFloat(t.amount || 0), 0);

            cell.innerHTML = `
                <span class="day-number">${day}</span>
                ${dayTotal > 0 ? `<span class="day-total">£${dayTotal.toFixed(2)}</span>` : ''}
            `;

            cell.onclick = () => openDayModal(dateStr);
            grid.appendChild(cell);
        }
    }

    function openDayModal(dateStr) {
        selectedDate = dateStr;
        document.getElementById('modalDateTitle').textContent = dateStr;
        document.getElementById('amountInput').value = '';
        document.getElementById('notesInput').value = '';
        document.getElementById('modal').style.display = 'flex';
        renderDayTransactions();
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
    }

    function renderDayTransactions() {
        const monthKey = selectedDate.substring(0, 7);
        const dayList = document.getElementById('dayTransactionsList');
        const dayTransactions = (transactions[monthKey] || []).filter(t => t.date === selectedDate);

        if (dayTransactions.length === 0) {
            dayList.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 10px;">No spending recorded.</div>';
            return;
        }

        dayList.innerHTML = dayTransactions.map((t, idx) => `
            <div style="display: flex; justify-content: space-between; align-items: center; background: #1f2937; padding: 8px; border-radius: 6px; margin-bottom: 6px;">
                <div>
                    <strong>£${parseFloat(t.amount).toFixed(2)}</strong> - ${t.category || 'General'}
                    <div style="font-size: 12px; color: #9ca3af;">${t.notes || ''}</div>
                </div>
                <button onclick="deleteTransaction(${idx})" style="background: transparent; border: none; color: #ef4444; cursor: pointer;">✕</button>
            </div>
        `).join('');
    }

    function addSpending() {
        const amount = document.getElementById('amountInput').value;
        const notes = document.getElementById('notesInput').value;
        const category = document.getElementById('categorySelect') ? document.getElementById('categorySelect').value : 'General';

        if (!amount || isNaN(amount)) return;

        const monthKey = selectedDate.substring(0, 7);
        if (!transactions[monthKey]) transactions[monthKey] = [];

        transactions[monthKey].push({
            id: Date.now(),
            date: selectedDate,
            amount: parseFloat(amount),
            notes: notes,
            category: category,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });

        saveData();
        renderDayTransactions();
        updateDisplay();
        buildCalendar();

        document.getElementById('amountInput').value = '';
        document.getElementById('notesInput').value = '';
    }

    function deleteTransaction(index) {
        const monthKey = selectedDate.substring(0, 7);
        const dayTransactions = (transactions[monthKey] || []).filter(t => t.date === selectedDate);
        const target = dayTransactions[index];

        if (target) {
            transactions[monthKey] = transactions[monthKey].filter(t => t.id !== target.id);
            saveData();
            renderDayTransactions();
            updateDisplay();
            buildCalendar();
        }
    }

    function openMonthlyOverview() {
        let selectedCategory = 'All';

        const modal = document.createElement('div');
        modal.id = 'monthlyOverviewModal';
        modal.style.cssText = 'position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000;';
        
        modal.onclick = (e) => {
            if (e.target === modal) modal.remove();
        };

        function renderContent() {
            const year = currentYear;
            const month = currentMonth;
            const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;
            const monthTransactions = transactions[monthKey] || [];

            const catMap = typeof spendingCategories !== 'undefined' ? spendingCategories : {};
            const presentCategories = ['All', ...new Set(monthTransactions.map(t => t.category).filter(Boolean))];

            const filteredTransactions = selectedCategory === 'All' 
                ? monthTransactions 
                : monthTransactions.filter(t => t.category === selectedCategory);

            const categoryTotal = filteredTransactions.reduce((sum, t) => sum + parseFloat(t.amount || 0), 0);

            const filterHtml = `
                <div style="display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px;">
                    ${presentCategories.map(catKey => {
                        const isActive = catKey === selectedCategory;
                        const catInfo = catMap[catKey];
                        const label = catKey === 'All' ? 'All' : (catInfo ? (catInfo.name || catKey) : catKey);
                        const iconHtml = catInfo && catInfo.icon ? `<i data-lucide="${catInfo.icon}"></i> ` : '';
                        
                        return `
                            <button class="cat-filter-btn" data-cat="${catKey}" style="
                                padding: 6px 12px;
                                border-radius: 20px;
                                border: 1px solid ${isActive ? '#3b82f6' : '#374151'};
                                background: ${isActive ? '#1d4ed8' : '#1f2937'};
                                color: #ffffff;
                                cursor: pointer;
                                font-size: 13px;
                                display: flex;
                                align-items: center;
                                gap: 6px;
                                white-space: nowrap;
                            ">${iconHtml}${label}</button>
                        `;
                    }).join('')}
                </div>
            `;

            let listHtml = '';
            if (filteredTransactions.length === 0) {
                listHtml = '<div style="text-align: center; color: #9ca3af; padding: 20px;">No transactions found.</div>';
            } else {
                listHtml = filteredTransactions.map(t => {
                    const catInfo = catMap[t.category];
                    const badgeColor = catInfo ? (catInfo.color || 'bg-slate-600') : 'bg-slate-600';
                    const badgeName = catInfo ? (catInfo.name || t.category) : (t.category || 'General');
                    const badgeIcon = catInfo && catInfo.icon ? `<i data-lucide="${catInfo.icon}"></i>` : '';

                    return `
                        <div style="background: #1f2937; padding: 12px; border-radius: 8px; margin-bottom: 8px;">
                            <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 6px;">
                                <span>£${parseFloat(t.amount).toFixed(2)}</span>
                                <span style="font-size: 12px; color: #9ca3af;">${t.time || ''}</span>
                            </div>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <span class="category-badge ${badgeColor}">${badgeIcon} ${badgeName}</span>
                                <span style="color: #d1d5db; font-size: 14px;">${t.notes || ''}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            modal.innerHTML = `
                <div style="background: #111827; padding: 20px; border-radius: 12px; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto; color: white;">
                    <div style="text-align: center; margin-bottom: 12px;">
                        <h3 style="margin: 0 0 8px 0;">${new Date(year, month).toLocaleString('default', { month: 'long', year: 'numeric' })}</h3>
                        <div style="display: inline-block; background: #10b981; color: white; padding: 4px 12px; border-radius: 6px; font-weight: bold;">
                            Total: £${categoryTotal.toFixed(2)}
                        </div>
                    </div>
                    ${filterHtml}
                    <div style="margin-bottom: 16px;">${listHtml}</div>
                    <button id="closeMonthlyBtn" style="width: 100%; padding: 10px; background: #374151; color: white; border: none; border-radius: 8px; cursor: pointer;">Close</button>
                </div>
            `;

            modal.querySelectorAll('.cat-filter-btn').forEach(btn => {
                btn.onclick = () => {
                    selectedCategory = btn.getAttribute('data-cat');
                    renderContent();
                };
            });

            modal.querySelector('#closeMonthlyBtn').onclick = () => modal.remove();

            if (window.lucide) {
                lucide.createIcons();
            }
        }

        document.body.appendChild(modal);
        renderContent();
    }

    function showHelp() {
        alert("Click any day cell on the calendar grid to log spending or view daily items. Click the total amount badge at the top to view category breakdowns.");
    }

    document.getElementById('prevBtn').onclick = () => navigateMonth(-1);
    document.getElementById('nextBtn').onclick = () => navigateMonth(1);
    document.getElementById('addBtn').onclick = addSpending;
    document.getElementById('closeBtn').onclick = closeModal;
    document.getElementById('helpBtn').onclick = showHelp;
    document.getElementById('monthTotal').onclick = () => openMonthlyOverview();
    document.getElementById('modal').onclick = function(e) { if (e.target === this) closeModal(); };

    loadData();
    updateDisplay();
    buildCalendar();
    if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
